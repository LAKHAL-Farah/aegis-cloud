# Stage 3b (optional): runtime rules for the k3s demo workload. Not part of the 12-scenario score.
# Load with:  falco -r /etc/falco/falco_rules.yaml -r siem/falco/aegis_rules.yaml
- rule: Aegis shell in container
  desc: An interactive shell was started inside a running container (kubectl exec, reverse shell staging).
  condition: >
    evt.type = execve and evt.dir = < and container.id != host
    and proc.name in (sh, bash, ash, zsh) and proc.tty != 0
  output: >
    Shell in container (user=%user.name container=%container.name image=%container.image.repository
    cmdline=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: WARNING
  tags: [aegis, container, mitre_execution, T1609]

- rule: Aegis read of cloud credentials in container
  desc: A process opened a service-account token or cloud credential file it does not normally read.
  condition: >
    open_read and container.id != host
    and (fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/token
         or fd.name endswith /.aws/credentials)
    and not proc.name in (kubelet, kube-proxy, coredns)
  output: >
    Credential file read (file=%fd.name proc=%proc.name container=%container.name pod=%k8s.pod.name)
  priority: WARNING
  tags: [aegis, container, mitre_credential_access, T1552.001]