name: release

# Push a tag like v1.0.0. The Lambda package is built reproducibly, an SBOM is generated, both are signed keyless with the
# workflow's GitHub OIDC identity, the SBOM is attested to the zip, and everything is verified in the same job before it is
# attached to the release. Nothing here holds a signing key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # keyless signing (Sigstore)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install cosign (pinned version, checksum verified)
        run: |
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign
      - name: build, sign, verify
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash release/release.sh all
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --title "$GITHUB_REF_NAME" --generate-notes
